description: TO-Breath, il cassonetto smart - gas (SGP30), temperatura/umidità (AHT20) e livello di riempimento con previsione del pieno (camera + Depth Anything V2 + ToF), con eventi verso un centro di controllo simulato.

# A list of network ports that the application exposes.
